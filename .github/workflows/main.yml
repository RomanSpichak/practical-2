#---------------------
# My first pipeline CI
#---------------------
# to run JAR - target/table_v.2.1-fat.jar

name: my_first_pipeline_CI

on:
  push: 
    branches:
    - main

jobs:
  install:
    runs-on: ubuntu-latest

    steps:

      - name: Clone repository to current VM
        uses: actions/checkout@v7

      - name: Run maven clean install
        run: mvn clean install

      - name: Check installing folder
        run: java -jar target/table_v.2.1-fat.jar