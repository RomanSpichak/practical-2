#---------------------
# My first pipeline CI
#---------------------

name: my_first_pipeline_CI

on:
  push: 
    branches:
    - main


jobs:

  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Run testing before run install
        run: mvn clean test


  install:
    runs-on: ubuntu-latest
    needs: testing
    steps:
      - name: Run instal after successful testing
        run: mvn clean install


  run-app:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Run result of install
        run: java -jar target/table_v.2.1-fat.jar
