#---------------------
# My first pipeline CI
#---------------------

name: my_first_pipeline_CI

on:
  push: 
    branches:
    - main


jobs:
  java_version:
    runs-on: ubuntu-latest
    steps:
      - name: Print Java Version
        run: java --version



  maven-version:
    runs-on: ubuntu-latest
    needs: java_version
    steps:
      - name: Print Maven Version
        run: mvn --version

      
