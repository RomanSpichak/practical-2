#---------------------
# My first pipeline CI
#---------------------
# to run JAR - target/table_v.2.1-fat.jar

name: my_first_pipeline_CI

on:
  push: 
    branches:
    - main

jobs:
  install:
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Printing version of Java
        run: java --version

      - name: Printing version of Maven
        run: mvn --version

      - name: Printing current folder
        run: ls -lh

      - name: Clone repository to current VM
        run: actions/checkout@v4

      - name: Printing current folder aftre clone
        run: ls -lh
