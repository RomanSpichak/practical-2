name: my_first_pipeline_CI

on:
  push: 
    branches:
    - main

jobs:
  install:
    runs-on: ubuntu-latest

    steps:

      - name: Clone repo to current VM
        uses: actions/checkout@v7

      - name: Installing JAR (testing, then install)
        run: mvn clean install

      - name: Printing table (Using Logger)
        run: java -jar target/table_v.2.1-fat.jar